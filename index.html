<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>高齡防跌：沉浸式立蛋挑戰</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bamboo-green: #4A7C59;
            --danger-red: #D64933;
            --glass-bg: rgba(250, 249, 246, 0.9);
            --ink-black: #333333;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000;
            color: var(--ink-black);
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        /* 畫面震動特效 */
        .shake-screen {
            animation: screenShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-15px, 12px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translate(15px, -12px) rotate(2deg); }
        }

        /* 白頻閃光特效 */
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: white; z-index: 999; pointer-events: none; opacity: 0;
        }
        .flash-active { animation: flashAnim 0.8s ease-out forwards; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* --- 強風特效 (強化版) --- */
        #wind-overlay {
            position: absolute; top: 0; left: -50vw; width: 150vw; height: 100vh;
            /* 明顯的風切線條與半透明漸層 */
            background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.4) 40px, rgba(255,255,255,0.6) 60px, transparent 100px);
            opacity: 0; z-index: 18; pointer-events: none;
            transform: skewX(-30deg); filter: blur(3px);
        }
        .wind-active { animation: windBlizzard 1.2s cubic-bezier(0.25, 0.1, 0.25, 1); }
        @keyframes windBlizzard {
            0% { transform: skewX(-30deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: skewX(-30deg) translateX(100vw); opacity: 0; }
        }

        /* --- 灑花特效 --- */
        .confetti {
            position: absolute; width: 12px; height: 12px;
            top: -20px; z-index: 999; pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* --- 相機與天空層 --- */
        #video_container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; overflow: hidden;
        }
        #input_video { display: none; }
        #output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        #sky-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #74ebd5, #ACB6E5);
            opacity: 0; z-index: 2; pointer-events: none; transition: opacity 2s ease-in-out;
        }

        /* --- 巨蛋與特效系統 --- */
        #giant-egg-wrapper {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            width: 220px; height: 300px; z-index: 10; pointer-events: none;
            transform-origin: bottom center; transition: transform 0.15s ease-out, filter 1s ease;
        }
        .egg-part {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #Fdfbf7; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.1), inset 5px 5px 15px rgba(255,255,255,0.8);
            border: 3px solid #EBE6D9; box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #egg-bottom { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); }
        #egg-top {
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            transform: translateY(-100vh); opacity: 0;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s;
        }
        .egg-merged #egg-top { transform: translateY(0); opacity: 1; }
        .egg-merged { filter: drop-shadow(0 0 40px rgba(255, 215, 0, 1)); }

        #crack-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 15; opacity: 0;
        }
        #crack-lines polyline {
            fill: none; stroke: #2a2a2a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.8)); stroke-dasharray: 400; stroke-dashoffset: 400;
        }
        #yolk-splash {
            position: absolute; top: 50%; left: 50%; width: 120px; height: 120px;
            background: radial-gradient(circle, #FFB300 30%, #FF8C00 100%); border-radius: 50%;
            transform: translate(-50%, -50%) scale(0); box-shadow: 0 0 30px rgba(255, 140, 0, 0.8);
            z-index: 12; opacity: 0;
        }
        .egg-broken-state .egg-part {
            background: linear-gradient(135deg, #EBE6D9 45%, #999 48%, #555 50%, #999 52%, #EBE6D9 55%);
            filter: grayscale(0.5); border-color: #777; box-shadow: none;
        }
        .egg-broken-state #egg-top { transform: translateY(-30px) translateX(-20px) rotate(-25deg); }
        .egg-broken-state #egg-bottom { transform: translateY(20px) translateX(15px) rotate(15deg); }
        .egg-broken-state #crack-lines { opacity: 1; }
        .egg-broken-state #crack-lines polyline { animation: drawCrack 0.4s ease-out forwards; }
        @keyframes drawCrack { to { stroke-dashoffset: 0; } }
        .egg-broken-state #yolk-splash { animation: splat 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes splat {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -30%) scale(1.2); opacity: 0.9; border-radius: 40% 60% 70% 30%; }
        }

        /* --- UI --- */
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 20; pointer-events: none; display: flex; justify-content: center; align-items: center;
        }
        .screen {
            background: var(--glass-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center; width: 85%; max-width: 400px; pointer-events: auto; border: 2px solid var(--bamboo-green);
        }
        .hidden { display: none !important; }
        h1 { margin: 5px 0 15px 0; color: var(--bamboo-green); font-size: 24px; }
        h2 { margin: 5px 0; font-size: 18px; }
        button {
            background-color: var(--bamboo-green); color: white; border: none; padding: 15px 30px;
            font-size: 18px; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-top: 20px; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(74, 124, 89, 0.4);
        }
        button:hover { background-color: #386044; transform: translateY(-2px); }

        #game-ui {
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 500px; text-align: center; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        #status-msg {
            font-size: 17px; font-weight: bold; padding: 12px 20px; background: var(--glass-bg); backdrop-filter: blur(5px);
            border-radius: 30px; color: var(--ink-black); box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; margin-bottom: 15px; border: 2px solid var(--bamboo-green); width: 100%; box-sizing: border-box;
        }
        #timer-display {
            font-size: 60px; font-weight: 900; color: white;
            text-shadow: 2px 2px 0px var(--bamboo-green), -2px -2px 0px var(--bamboo-green), 2px -2px 0px var(--bamboo-green), -2px 2px 0px var(--bamboo-green);
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    <div id="wind-overlay"></div>

    <div id="video_container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    
    <div id="sky-bg"></div>

    <div id="giant-egg-wrapper">
        <div id="egg-bottom" class="egg-part"></div>
        <div id="egg-top" class="egg-part"></div>
        <div id="yolk-splash"></div>
        <svg id="crack-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polyline points="30,-10 45,20 35,40 60,60 50,80 70,110" />
            <polyline points="75,-10 60,30 70,50 50,70 60,110" />
        </svg>
    </div>

    <div id="ui-container">
        <div id="intro-screen" class="screen">
            <h1>🌿 防跌立蛋挑戰 🌿</h1>
            <ul style="text-align: left; line-height: 1.6; font-size: 15px; padding-left: 20px;">
                <li><strong>準備：</strong> 退後，讓<strong>頭、膝蓋與腳踝</strong>全入鏡。</li>
                <li><strong>開始：</strong> 畫面會出現<strong>小光圈</strong>。任一隻腳抬起貼在小腿(前後內外皆可)，即天亮計時！</li>
                <li><strong>挑戰：</strong> 堅持 <strong>30 秒</strong> 獲得勝利！雙手隨意擺動沒關係，但身體重心嚴重傾斜或腳掉下來，蛋就會破！</li>
            </ul>
            <button id="start-btn">開啟鏡頭與音效</button>
        </div>

        <div id="game-screen" class="hidden">
            <div id="game-ui">
                <div id="status-msg">第一階段：請退後，讓全身完整入鏡...</div>
                <div id="timer-display">0.00</div>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h1 id="result-title">💥 蛋破了！ 💥</h1>
            <h2 id="final-time">堅持時間：0.00 秒</h2>
            <hr style="border-top: 1px dashed #ccc; margin: 15px 0;">
            <h3 style="color: var(--ink-black);">高齡防跌能力評估：</h3>
            <h2 id="rank-title" style="color: var(--danger-red); font-size: 26px;">稱號</h2>
            <p id="rank-desc" style="color: #555; font-size: 15px;"></p>
            <button id="retry-btn">再挑戰一次</button>
        </div>
    </div>

    <script type="module">
        // --- 網頁合成音效系統 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function playMergeSound() {
            playTone(440, 'sine', 0.5, 0.2);
            setTimeout(() => playTone(880, 'sine', 0.8, 0.3), 100);
        }

        function playCrashSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const bufferSize = audioCtx.sampleRate * 0.5; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; 
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 1000;
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            noise.start();
        }
        
        function playTick() { playTone(1200, 'square', 0.05, 0.05); }

        function playWindSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const bufferSize = audioCtx.sampleRate * 1.5; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(100, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.5);
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.5);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.5);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start();
        }

        // --- DOM Elements ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const introScreen = document.getElementById('intro-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const skyBg = document.getElementById('sky-bg');
        const giantEggWrapper = document.getElementById('giant-egg-wrapper');
        const flashOverlay = document.getElementById('flash-overlay');
        const windOverlay = document.getElementById('wind-overlay');
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const timerDisplay = document.getElementById('timer-display');
        const statusMsg = document.getElementById('status-msg');

        let gameState = 'INIT'; 
        let startTime = 0; let playStartTime = 0; 
        let elapsedTime = 0; let timerInterval = null; let windTimer = null;
        
        let lockedStandKneeIdx = null; let lockedStandAnkleIdx = null; let lockedRaisedAnkleIdx = null;

        const VISIBILITY_THRESHOLD = 0.6;  
        // 放寬掉落與開始的容錯，不再侷限只能在正前方
        const START_TOLERANCE_Y = 0.35;
        const START_TOLERANCE_X = 0.6;
        const DROP_TOLERANCE_Y = 0.5;

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 0, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { if(gameState !== 'GAMEOVER' && gameState !== 'INIT') await pose.send({image: videoElement}); }, 
            facingMode: "user", width: 640, height: 480
        });

        startBtn.addEventListener('click', () => {
            audioCtx.resume();
            introScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
            resetGame(); camera.start();
        });

        retryBtn.addEventListener('click', () => {
            resultScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
            document.body.classList.remove('shake-screen');
            document.querySelectorAll('.confetti').forEach(e => e.remove()); 
            resetGame();
        });

        function resetGame() {
            gameState = 'POSITIONING_BODY';
            elapsedTime = 0; timerDisplay.innerText = "0.00";
            
            skyBg.style.opacity = '0';
            giantEggWrapper.className = ''; giantEggWrapper.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            flashOverlay.className = ''; windOverlay.className = '';
            
            lockedStandKneeIdx = null; lockedStandAnkleIdx = null; lockedRaisedAnkleIdx = null;
            clearTimeout(windTimer); clearInterval(timerInterval);
            
            updateStatus("第一階段：請退後，讓「頭、膝蓋、腳踝」全入鏡", "var(--glass-bg)", "var(--ink-black)", "var(--bamboo-green)");
        }

        function updateStatus(text, bg, color, borderColor) {
            statusMsg.innerText = text; statusMsg.style.background = bg;
            statusMsg.style.color = color; statusMsg.style.borderColor = borderColor;
        }

        function drawTargetCircle(x, y, radius, color) {
            canvasCtx.beginPath(); canvasCtx.arc(x * canvasElement.width, y * canvasElement.height, radius, 0, 2 * Math.PI);
            canvasCtx.strokeStyle = color; canvasCtx.lineWidth = 3;
            canvasCtx.shadowBlur = 10; canvasCtx.shadowColor = color; canvasCtx.stroke();
            canvasCtx.beginPath(); canvasCtx.arc(x * canvasElement.width, y * canvasElement.height, radius * 0.3, 0, 2 * Math.PI);
            canvasCtx.fillStyle = color; canvasCtx.fill(); canvasCtx.shadowBlur = 0;
        }

        function onResults(results) {
            canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (gameState !== 'GAMEOVER') {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                if (results.poseLandmarks) {
                    const bodyLandmarks = results.poseLandmarks.map((lm, index) => index > 10 ? lm : { ...lm, visibility: 0 });
                    const BODY_CONNECTIONS = POSE_CONNECTIONS.filter(conn => conn[0] > 10 && conn[1] > 10);
                    drawConnectors(canvasCtx, bodyLandmarks, BODY_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.4)', lineWidth: 2});
                    drawLandmarks(canvasCtx, bodyLandmarks, {color: '#4A7C59', lineWidth: 1, radius: 2});
                }
            }
            if (results.poseLandmarks) processGameLogic(results.poseLandmarks);
            canvasCtx.restore();
        }

        function getDist(p1, p2) { return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)); }

        function processGameLogic(landmarks) {
            if(gameState === 'GAMEOVER' || gameState === 'INIT') return;

            const nose = landmarks[0];
            const leftShoulder = landmarks[11]; const rightShoulder = landmarks[12];
            const leftHip = landmarks[23]; const rightHip = landmarks[24];
            const leftKnee = landmarks[25]; const rightKnee = landmarks[26];
            const leftAnkle = landmarks[27]; const rightAnkle = landmarks[28];

            if (!nose || !leftShoulder || !rightShoulder || !leftHip || !rightHip || !leftKnee || !rightKnee || !leftAnkle || !rightAnkle) return;

            if (gameState === 'POSITIONING_BODY') {
                const isFullBodyVisible = (nose.visibility > VISIBILITY_THRESHOLD && 
                                           leftKnee.visibility > VISIBILITY_THRESHOLD && rightKnee.visibility > VISIBILITY_THRESHOLD &&
                                           leftAnkle.visibility > VISIBILITY_THRESHOLD && rightAnkle.visibility > VISIBILITY_THRESHOLD);
                if (isFullBodyVisible) {
                    gameState = 'POSITIONING_LEG'; 
                    updateStatus("✅ 全身入鏡！請將任一隻腳抬起，放在小腿光圈處！", "#FFD700", "black", "#FFD700");
                }
                return;
            }

            if (gameState === 'POSITIONING_LEG') {
                const leftCalfMid = { x: (leftKnee.x + leftAnkle.x)/2, y: (leftKnee.y + leftAnkle.y)/2 };
                const rightCalfMid = { x: (rightKnee.x + rightAnkle.x)/2, y: (rightKnee.y + rightAnkle.y)/2 };
                
                const leftCalfLen = getDist(leftKnee, leftAnkle); const rightCalfLen = getDist(rightKnee, rightAnkle);
                
                // 視覺光圈大幅縮小
                const targetRadiusL = leftCalfLen * 0.15 * canvasElement.width; 
                const targetRadiusR = rightCalfLen * 0.15 * canvasElement.width;

                drawTargetCircle(leftCalfMid.x, leftCalfMid.y, targetRadiusL, '#FFD700');
                drawTargetCircle(rightCalfMid.x, rightCalfMid.y, targetRadiusR, '#FFD700');

                // 矩形判定區 (解決放內側、外側判定不到的問題)
                const dyRtoL = Math.abs(rightAnkle.y - leftCalfMid.y);
                const dxRtoL = Math.abs(rightAnkle.x - leftCalfMid.x);
                const dyLtoR = Math.abs(leftAnkle.y - rightCalfMid.y);
                const dxLtoR = Math.abs(leftAnkle.x - rightCalfMid.x);

                if (dyRtoL < leftCalfLen * START_TOLERANCE_Y && dxRtoL < leftCalfLen * START_TOLERANCE_X) {
                    lockedStandKneeIdx = 25; lockedStandAnkleIdx = 27; lockedRaisedAnkleIdx = 28; startGame();
                } else if (dyLtoR < rightCalfLen * START_TOLERANCE_Y && dxLtoR < rightCalfLen * START_TOLERANCE_X) {
                    lockedStandKneeIdx = 26; lockedStandAnkleIdx = 28; lockedRaisedAnkleIdx = 27; startGame();
                }
            } 
            else if (gameState === 'PLAYING') {
                const standKnee = landmarks[lockedStandKneeIdx]; const standAnkle = landmarks[lockedStandAnkleIdx];
                const raisedAnkle = landmarks[lockedRaisedAnkleIdx];
                const calfMid = { x: (standKnee.x + standAnkle.x)/2, y: (standKnee.y + standAnkle.y)/2 };
                const calfLen = getDist(standKnee, standAnkle); 

                // 判斷是否掉落 (主要看垂直高度)
                const currentDy = Math.abs(raisedAnkle.y - calfMid.y);

                // --- 🌟 防抬手誤判：用軀幹取代鼻子，計算真實身體傾斜 ---
                const shoulderCenterX = (leftShoulder.x + rightShoulder.x) / 2;
                const hipCenterX = (leftHip.x + rightHip.x) / 2;
                const sway = shoulderCenterX - hipCenterX; 

                // 放大視覺傾斜角
                let tiltAngle = sway * 450; 
                
                // 只要蛋碰到邊邊 (角度大於 45 度) 就直接破！
                if (tiltAngle > 45 || tiltAngle < -45) {
                    endGame("身體傾斜過大，碰到邊緣破裂！");
                    return;
                }

                giantEggWrapper.style.transform = `translate(-50%, -50%) rotate(${tiltAngle}deg)`;

                if (Date.now() - playStartTime > 1000) {
                    // 如果腳滑落 (垂直高度差異大於小腿長度 50%)
                    if (currentDy > calfLen * DROP_TOLERANCE_Y) { 
                        endGame("腳滑落了！蛋破裂！"); 
                        return; 
                    }

                    if (Math.abs(tiltAngle) > 30) {
                        updateStatus("⚠️ 太晃了，穩住核心！", "rgba(214, 73, 51, 0.9)", "white", "var(--danger-red)");
                    } else {
                        updateStatus("✨ 完美平衡中...", "rgba(74, 124, 89, 0.9)", "white", "var(--bamboo-green)");
                    }
                } else {
                    updateStatus("🥚 天亮合體！穩住重心...", "#FFD700", "black", "#FFD700");
                }
            }
        }

        function startGame() {
            gameState = 'PLAYING'; playStartTime = Date.now(); startTime = Date.now();
            
            playMergeSound(); 
            giantEggWrapper.classList.add('egg-merged'); 
            skyBg.style.opacity = '1'; // 開始計時才天亮

            scheduleNextWind(); // 啟動不規則陣風

            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedTime = (Date.now() - startTime) / 1000;
                
                // 30秒上限勝利判定
                if(elapsedTime >= 30) {
                    elapsedTime = 30;
                    winGame();
                } else {
                    timerDisplay.innerText = elapsedTime.toFixed(2);
                    if (Math.floor(elapsedTime * 10) % 10 === 0) playTick(); 
                }
            }, 100); 
        }

        // --- 強風系統 (不規則發動) ---
        function scheduleNextWind() {
            if (gameState !== 'PLAYING') return;
            // 完全隨機：3秒 到 10秒 之間發動一次
            const delay = 3000 + Math.random() * 7000; 
            windTimer = setTimeout(() => {
                if (gameState === 'PLAYING') { triggerWind(); scheduleNextWind(); }
            }, delay);
        }

        function triggerWind() {
            playWindSound();
            windOverlay.classList.remove('wind-active');
            void windOverlay.offsetWidth; // 重置 CSS 動畫
            windOverlay.classList.add('wind-active');
        }

        // --- 勝利灑花系統 ---
        function startConfetti() {
            const colors = ['#FFD700', '#D64933', '#4A7C59', '#74ebd5', '#FFF'];
            for(let i=0; i<80; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                c.style.animationDelay = Math.random() * 1 + 's';
                document.body.appendChild(c);
            }
        }

        function winGame() {
            gameState = 'GAMEOVER';
            clearInterval(timerInterval); clearTimeout(windTimer);
            updateStatus("🎉 挑戰成功！", "#FFD700", "black", "#FFD700");
            startConfetti();
            setTimeout(() => showResultScreen(true), 2500);
        }

        function endGame(reason) {
            gameState = 'GAMEOVER';
            clearInterval(timerInterval); clearTimeout(windTimer);
            
            playCrashSound(); 
            flashOverlay.classList.add('flash-active');
            document.body.classList.add('shake-screen');
            giantEggWrapper.classList.add('egg-broken-state');
            updateStatus(reason, "rgba(214, 73, 51, 0.9)", "white", "#FFF");

            setTimeout(() => showResultScreen(false), 2000); 
        }

        function showResultScreen(isWin) {
            gameScreen.classList.add('hidden'); resultScreen.classList.remove('hidden');
            document.getElementById('final-time').innerText = `堅持時間：${elapsedTime.toFixed(2)} 秒`;
            const titleEl = document.getElementById('result-title');
            const rankTitle = document.getElementById('rank-title');
            const rankDesc = document.getElementById('rank-desc');

            if (isWin) {
                titleEl.innerText = "🎉 挑戰成功 🎉";
                rankTitle.innerText = "防跌大宗師 (30秒滿分)";
                rankDesc.innerText = "太厲害了！您的核心與平衡感絕佳，下肢肌力非常健康！";
                rankTitle.style.color = "var(--bamboo-green)";
            } else {
                titleEl.innerText = "💥 蛋破了！ 💥";
                if (elapsedTime < 10) {
                    rankTitle.innerText = "需要加強 (0-10秒)";
                    rankDesc.innerText = "平衡感稍微不足喔！可以多扶著牆壁練習單腳站立，預防跌倒。";
                    rankTitle.style.color = "var(--danger-red)";
                } else if (elapsedTime < 20) {
                    rankTitle.innerText = "表現不錯 (10-20秒)";
                    rankDesc.innerText = "有基本的平衡能力！平常多散步、活動關節，能讓下盤更穩固。";
                    rankTitle.style.color = "#D68C33";
                } else {
                    rankTitle.innerText = "核心達人 (20-29秒)";
                    rankDesc.innerText = "非常優秀！您的本體感覺很敏銳，只差一點點就能拿到滿分了！";
                    rankTitle.style.color = "#3376D6";
                }
            }
        }
    </script>
</body>
</html>
