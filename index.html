<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>沉浸式端午立蛋挑戰</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bamboo-green: #4A7C59;
            --danger-red: #D64933;
            --glass-bg: rgba(250, 249, 246, 0.85);
            --ink-black: #333333;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000;
            color: var(--ink-black);
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        /* 畫面震動特效 (破掉時觸發) */
        .shake-screen {
            animation: screenShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-10px, 8px) rotate(-1deg); }
            20%, 40%, 60%, 80% { transform: translate(10px, -8px) rotate(1deg); }
        }

        /* 白頻閃光特效 */
        #flash-overlay {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: white;
            z-index: 999; pointer-events: none;
            opacity: 0;
        }
        .flash-active {
            animation: flashAnim 0.8s ease-out forwards;
        }
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* --- 相機與天空層 --- */
        #video_container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1; overflow: hidden;
        }
        #input_video { display: none; }
        #output_canvas {
            width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); 
        }

        #sky-bg {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #74ebd5, #ACB6E5);
            opacity: 0; z-index: 2; pointer-events: none;
            transition: opacity 2s ease-in-out;
        }
        #sky-bg::before {
            content: ''; position: absolute;
            bottom: 20%; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,253,208,1) 0%, rgba(255,253,208,0) 70%);
            border-radius: 50%; opacity: 0.8;
        }

        /* --- 巨蛋與特效系統 --- */
        #giant-egg-wrapper {
            position: absolute;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; height: 300px;
            z-index: 10; pointer-events: none;
            transform-origin: bottom center; 
            transition: transform 0.1s ease-out, filter 1s ease;
        }

        .egg-part {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #Fdfbf7;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.1), inset 5px 5px 15px rgba(255,255,255,0.8);
            border: 3px solid #EBE6D9; box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #egg-bottom { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); }
        #egg-top {
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            transform: translateY(-80vh);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s;
        }

        .egg-merged #egg-top { transform: translateY(0); opacity: 1; }
        .egg-merged { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); }

        /* 逼真裂痕 (SVG Overlay) */
        #crack-lines {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 15;
            opacity: 0;
        }
        #crack-lines polyline {
            fill: none; stroke: #2a2a2a; stroke-width: 4;
            stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.8));
            stroke-dasharray: 400; stroke-dashoffset: 400;
        }

        /* 爆漿蛋黃 */
        #yolk-splash {
            position: absolute; top: 50%; left: 50%;
            width: 120px; height: 120px;
            background: radial-gradient(circle, #FFB300 30%, #FF8C00 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.8);
            z-index: 12; opacity: 0;
        }

        /* 破裂狀態啟動！ */
        .egg-broken-state .egg-part {
            background: linear-gradient(135deg, #EBE6D9 45%, #999 48%, #555 50%, #999 52%, #EBE6D9 55%);
            filter: grayscale(0.5); border-color: #777; box-shadow: none;
        }
        /* 物理分離 */
        .egg-broken-state #egg-top {
            transform: translateY(-30px) translateX(-20px) rotate(-25deg);
        }
        .egg-broken-state #egg-bottom {
            transform: translateY(20px) translateX(15px) rotate(15deg);
        }
        /* 畫出裂痕 */
        .egg-broken-state #crack-lines { opacity: 1; }
        .egg-broken-state #crack-lines polyline {
            animation: drawCrack 0.4s ease-out forwards;
        }
        @keyframes drawCrack { to { stroke-dashoffset: 0; } }
        /* 噴出蛋黃 */
        .egg-broken-state #yolk-splash {
            animation: splat 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes splat {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -30%) scale(1.2); opacity: 0.9; border-radius: 40% 60% 70% 30%; }
        }

        /* --- UI 與文字 --- */
        #ui-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 20; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }

        .screen {
            background: var(--glass-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center; width: 85%; max-width: 400px;
            pointer-events: auto; border: 2px solid var(--bamboo-green);
        }

        .hidden { display: none !important; }

        h1 { margin: 5px 0 15px 0; color: var(--bamboo-green); font-size: 24px; }
        h2 { margin: 5px 0; font-size: 18px; }
        button {
            background-color: var(--bamboo-green); color: white; border: none; padding: 15px 30px;
            font-size: 18px; border-radius: 12px; cursor: pointer; transition: 0.2s;
            margin-top: 20px; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(74, 124, 89, 0.4);
        }
        button:hover { background-color: #386044; transform: translateY(-2px); }

        #game-ui {
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 500px; text-align: center; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        
        #status-msg {
            font-size: 17px; font-weight: bold; padding: 12px 20px;
            background: var(--glass-bg); backdrop-filter: blur(5px);
            border-radius: 30px; color: var(--ink-black);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; margin-bottom: 15px;
            border: 2px solid var(--bamboo-green); width: 100%; box-sizing: border-box;
        }

        #timer-display {
            font-size: 60px; font-weight: 900; color: white;
            text-shadow: 2px 2px 0px var(--bamboo-green), -2px -2px 0px var(--bamboo-green), 2px -2px 0px var(--bamboo-green), -2px 2px 0px var(--bamboo-green);
        }

        @keyframes startFlashText {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; text-shadow: 0 0 30px #FFD700; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        #start-vfx {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 60px; color: #FFF; font-weight: 900;
            text-shadow: 0 0 20px var(--danger-red), 0 0 40px var(--danger-red);
            z-index: 100; pointer-events: none; white-space: nowrap; opacity: 0;
        }
        .vfx-active { animation: startFlashText 1.5s ease-out forwards; }

    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="video_container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    
    <div id="sky-bg"></div>

    <div id="giant-egg-wrapper">
        <div id="egg-bottom" class="egg-part"></div>
        <div id="egg-top" class="egg-part"></div>
        
        <div id="yolk-splash"></div>
        
        <svg id="crack-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polyline points="30,-10 45,20 35,40 60,60 50,80 70,110" />
            <polyline points="75,-10 60,30 70,50 50,70 60,110" />
        </svg>
    </div>
    
    <div id="start-vfx" class="hidden">開始計時！</div>

    <div id="ui-container">
        <div id="intro-screen" class="screen">
            <h1>🌿 沉浸式立蛋挑戰 🌿</h1>
            <ul style="text-align: left; line-height: 1.6; font-size: 15px; padding-left: 20px;">
                <li><strong>階段一：</strong> 退後，讓<strong>頭、膝蓋與雙腳踝</strong>完全進入畫面。確認後會觸發天亮。</li>
                <li><strong>階段二：</strong> 請憑感覺，將單腳抬起<strong>精準貼在</strong>小腿與膝蓋一半處。</li>
                <li><strong>嚴格破關條件：</strong> 穩住重心！如果身體太晃，或是<strong>腳滑落離開小腿</strong>，蛋都會當場爆裂！</li>
            </ul>
            <button id="start-btn">開啟鏡頭準備挑戰</button>
        </div>

        <div id="game-screen" class="hidden">
            <div id="game-ui">
                <div id="status-msg">第一階段：請退後，讓全身完整入鏡...</div>
                <div id="timer-display">0.00</div>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h1>💥 蛋破了！ 💥</h1>
            <h2 id="final-time">堅持時間：0.00 秒</h2>
            <hr style="border-top: 1px dashed #ccc; margin: 15px 0;">
            <h3 style="color: var(--ink-black);">體適能常模評分：</h3>
            <h2 id="rank-title" style="color: var(--danger-red); font-size: 26px;">稱號</h2>
            <p id="rank-desc" style="color: #555; font-size: 15px;"></p>
            <button id="retry-btn">再挑戰一次</button>
        </div>
    </div>

    <script type="module">
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const introScreen = document.getElementById('intro-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const skyBg = document.getElementById('sky-bg');
        const giantEggWrapper = document.getElementById('giant-egg-wrapper');
        const startVfx = document.getElementById('start-vfx');
        const flashOverlay = document.getElementById('flash-overlay');
        
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const timerDisplay = document.getElementById('timer-display');
        const statusMsg = document.getElementById('status-msg');

        let gameState = 'INIT'; 
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        // --- 核心判定參數 ---
        const VISIBILITY_THRESHOLD = 0.6;  
        const SWAY_FAIL = 0.12;
        // 修正 2：更嚴格的啟動距離，必須貼很近才開始
        const START_TOLERANCE = 0.08; 
        // 修正 3：只要腳離開小腿超過這個距離，立刻判定滑落失敗
        const DROP_TOLERANCE = 0.15; 

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({
            modelComplexity: 0, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if(gameState !== 'GAMEOVER' && gameState !== 'INIT') {
                    await pose.send({image: videoElement});
                }
            },
            facingMode: "user", width: 640, height: 480
        });

        startBtn.addEventListener('click', () => {
            introScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            resetGame();
            camera.start().catch(err => {
                updateStatus("無法開啟攝影機，請檢查權限設定", "var(--danger-red)", "white", "var(--danger-red)");
            });
        });

        retryBtn.addEventListener('click', () => {
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            document.body.classList.remove('shake-screen'); // 清除震動
            resetGame();
        });

        function resetGame() {
            gameState = 'POSITIONING_BODY';
            elapsedTime = 0;
            timerDisplay.innerText = "0.00";
            
            skyBg.style.opacity = '0';
            giantEggWrapper.className = ''; 
            giantEggWrapper.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            flashOverlay.className = '';
            
            updateStatus("第一階段：請退後，讓「頭、膝蓋、腳踝」全入鏡", "var(--glass-bg)", "var(--ink-black)", "var(--bamboo-green)");
            clearInterval(timerInterval);
        }

        function updateStatus(text, bg, color, borderColor) {
            statusMsg.innerText = text;
            statusMsg.style.background = bg;
            statusMsg.style.color = color;
            statusMsg.style.borderColor = borderColor;
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (gameState === 'POSITIONING_BODY') {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                
                if (results.poseLandmarks) {
                    const bodyLandmarks = results.poseLandmarks.map((lm, index) => index > 10 ? lm : { ...lm, visibility: 0 });
                    const BODY_CONNECTIONS = POSE_CONNECTIONS.filter(conn => conn[0] > 10 && conn[1] > 10);
                    drawConnectors(canvasCtx, bodyLandmarks, BODY_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.7)', lineWidth: 4});
                    drawLandmarks(canvasCtx, bodyLandmarks, {color: '#4A7C59', lineWidth: 2, radius: 4});
                }
            } 
            
            if (results.poseLandmarks) {
                processGameLogic(results.poseLandmarks);
            }
            canvasCtx.restore();
        }

        function processGameLogic(landmarks) {
            if(gameState === 'GAMEOVER' || gameState === 'INIT') return;

            const nose = landmarks[0];
            const leftHip = landmarks[23];
            const rightHip = landmarks[24];
            const leftKnee = landmarks[25];
            const rightKnee = landmarks[26];
            const leftAnkle = landmarks[27];
            const rightAnkle = landmarks[28];

            if (!nose || !leftHip || !rightHip || !leftKnee || !rightKnee || !leftAnkle || !rightAnkle) return;

            // 修正 1：嚴格判定小腿與腳踝，所有部位都必須高於可見度閾值
            const isFullBodyVisible = (nose.visibility > VISIBILITY_THRESHOLD && 
                                       leftKnee.visibility > VISIBILITY_THRESHOLD && 
                                       rightKnee.visibility > VISIBILITY_THRESHOLD &&
                                       leftAnkle.visibility > VISIBILITY_THRESHOLD && 
                                       rightAnkle.visibility > VISIBILITY_THRESHOLD);

            if (gameState === 'POSITIONING_BODY') {
                if (isFullBodyVisible) {
                    gameState = 'TRANSITIONING'; 
                    updateStatus("✅ 全身成功入鏡！準備天亮...", "var(--bamboo-green)", "white", "var(--bamboo-green)");
                    
                    giantEggWrapper.classList.add('egg-merged');
                    skyBg.style.opacity = '1';

                    setTimeout(() => {
                        gameState = 'POSITIONING_LEG';
                        updateStatus("第二階段：請憑感覺，將單腳準確貼在小腿中點", "rgba(50,50,50,0.8)", "white", "var(--bamboo-green)");
                    }, 1500);
                }
                return;
            }

            if (gameState === 'POSITIONING_LEG' || gameState === 'PLAYING') {
                
                let standAnkle, standKnee, raisedAnkle;
                if (leftAnkle.y > rightAnkle.y) {
                    standAnkle = leftAnkle; standKnee = leftKnee; raisedAnkle = rightAnkle;
                } else {
                    standAnkle = rightAnkle; standKnee = rightKnee; raisedAnkle = leftAnkle;
                }

                const targetMidX = (standKnee.x + standAnkle.x) / 2;
                const targetMidY = (standKnee.y + standAnkle.y) / 2;

                const dx = raisedAnkle.x - targetMidX;
                const dy = raisedAnkle.y - targetMidY;
                const distanceToTarget = Math.sqrt(dx * dx + dy * dy);

                const hipCenterX = (leftHip.x + rightHip.x) / 2;
                const sway = nose.x - hipCenterX; 
                const absSway = Math.abs(sway);

                if (gameState === 'POSITIONING_LEG') {
                    // 修正 2：嚴格的啟動容錯值
                    if (distanceToTarget < START_TOLERANCE) { 
                        startGame();
                    }
                } 
                else if (gameState === 'PLAYING') {
                    
                    // 修正 3：腳一離開小腿，直接破裂
                    if (distanceToTarget > DROP_TOLERANCE) {
                        endGame("腳滑落了！蛋破裂！");
                        return;
                    }

                    let tiltAngle = sway * 400; 
                    if(tiltAngle > 45) tiltAngle = 45;
                    if(tiltAngle < -45) tiltAngle = -45;
                    
                    giantEggWrapper.style.transform = `translate(-50%, -50%) rotate(${tiltAngle}deg)`;

                    // 失敗判定：身體搖晃過大
                    if (absSway > SWAY_FAIL) {
                        endGame("身體傾斜過大，蛋破了！");
                        return;
                    } 

                    if (absSway > SWAY_FAIL * 0.6) {
                        updateStatus("⚠️ 太晃了，穩住！", "rgba(214, 73, 51, 0.9)", "white", "var(--danger-red)");
                    } else {
                        updateStatus("✨ 完美平衡中...", "rgba(74, 124, 89, 0.9)", "white", "var(--bamboo-green)");
                    }
                }
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            startTime = Date.now();
            updateStatus("專注核心！", "rgba(74, 124, 89, 0.9)", "white", "var(--bamboo-green)");
            
            startVfx.classList.remove('hidden');
            startVfx.classList.add('vfx-active');
            setTimeout(() => {
                startVfx.classList.remove('vfx-active');
                startVfx.classList.add('hidden');
            }, 1500);

            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedTime = (Date.now() - startTime) / 1000;
                timerDisplay.innerText = elapsedTime.toFixed(2);
            }, 100); 
        }

        // 修正 4：史詩級破裂特效觸發區
        function endGame(reason) {
            gameState = 'GAMEOVER';
            clearInterval(timerInterval);
            
            // 觸發白頻閃光與全螢幕地震
            flashOverlay.classList.add('flash-active');
            document.body.classList.add('shake-screen');
            
            // 觸發巨蛋分離、裂痕與噴射蛋黃
            giantEggWrapper.classList.add('egg-broken-state');
            
            updateStatus(reason, "rgba(214, 73, 51, 0.9)", "white", "#FFF");

            setTimeout(showResultScreen, 2000); // 讓特效飛一下再顯示結算
        }

        function showResultScreen() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            document.getElementById('final-time').innerText = `堅持時間：${elapsedTime.toFixed(2)} 秒`;
            
            const rankTitle = document.getElementById('rank-title');
            const rankDesc = document.getElementById('rank-desc');

            if (elapsedTime < 5) {
                rankTitle.innerText = "屈原的嘆息 (0-5秒)";
                rankDesc.innerText = "哎呀，這蛋殼有點脆！再多練習核心，下次一定行！";
                rankTitle.style.color = "var(--danger-red)";
            } else if (elapsedTime < 15) {
                rankTitle.innerText = "雄黃蛋 (5-15秒)";
                rankDesc.innerText = "及格了！在看不到自己的情況下能站穩，很不容易！";
                rankTitle.style.color = "#D68C33";
            } else if (elapsedTime < 30) {
                rankTitle.innerText = "龍舟舵手 (15-30秒)";
                rankDesc.innerText = "不錯喔！本體感覺非常敏銳，是個標準的立蛋家。";
                rankTitle.style.color = "#3376D6";
            } else {
                rankTitle.innerText = "盲測宗師 (30秒以上)";
                rankDesc.innerText = "太神了！失去視覺還能人蛋合一，端午節立蛋王非你莫屬！";
                rankTitle.style.color = "var(--bamboo-green)";
            }
        }
    </script>
</body>
</html>
