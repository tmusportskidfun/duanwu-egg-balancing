<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>端午單足立蛋挑戰</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bamboo-green: #4A7C59;
            --danger-red: #D64933;
            --glass-bg: rgba(250, 249, 246, 0.85);
            --ink-black: #333333;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000;
            color: var(--ink-black);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- 修正：完美滿版且不拉伸變形 --- */
        #video_container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        #input_video { display: none; }

        #output_canvas {
            width: 100%; 
            height: 100%;
            object-fit: cover; /* 關鍵：填滿整個螢幕且裁切多餘部分，去黑邊不變形 */
            transform: scaleX(-1); /* 鏡像 */
        }

        /* --- UI 浮層 --- */
        #ui-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }

        .screen {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 85%; max-width: 400px;
            pointer-events: auto;
            border: 2px solid var(--bamboo-green);
        }

        .hidden { display: none !important; }

        h1 { margin: 5px 0 15px 0; color: var(--bamboo-green); font-size: 24px; }
        h2 { margin: 5px 0; font-size: 18px; }

        button {
            background-color: var(--bamboo-green); color: white;
            border: none; padding: 15px 30px; font-size: 18px;
            border-radius: 12px; cursor: pointer; transition: 0.2s;
            margin-top: 20px; font-weight: bold; width: 100%;
            box-shadow: 0 4px 10px rgba(74, 124, 89, 0.4);
        }
        button:hover { background-color: #386044; transform: translateY(-2px); }

        /* --- 修正：遊戲介面強制絕對置中 --- */
        #game-ui {
            position: absolute; 
            top: 8%;
            left: 50%;
            transform: translateX(-50%); /* 關鍵置中語法 */
            width: 90%; max-width: 400px;
            text-align: center; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        
        #status-msg {
            font-size: 18px; font-weight: bold; padding: 10px 20px;
            background: var(--glass-bg); backdrop-filter: blur(5px);
            border-radius: 30px; color: var(--ink-black);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s; margin-bottom: 15px;
            border: 2px solid var(--bamboo-green);
            width: 100%; box-sizing: border-box;
        }

        #timer-display {
            font-size: 56px; font-weight: 900; color: white;
            text-shadow: 2px 2px 0px var(--bamboo-green), -2px -2px 0px var(--bamboo-green), 2px -2px 0px var(--bamboo-green), -2px 2px 0px var(--bamboo-green);
            margin-bottom: 10px;
        }

        /* 蛋的特效 */
        #egg-container {
            position: relative; width: 60px; height: 80px;
            perspective: 1000px; margin-bottom: 10px;
        }

        .egg {
            width: 100%; height: 100%; background-color: #Fdfbf7;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -8px -8px 15px rgba(0,0,0,0.1), 0 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s ease-out; border: 2px solid #EBE6D9;
        }

        .egg-warning {
            animation: shake 0.3s infinite;
            box-shadow: inset -8px -8px 15px rgba(214, 73, 51, 0.2), 0 0 20px rgba(214, 73, 51, 0.8);
            border-color: var(--danger-red);
        }

        .egg-broken {
            background: linear-gradient(135deg, #Fdfbf7 45%, #555 48%, #333 50%, #555 52%, #Fdfbf7 55%);
            transform: scale(1.1) rotate(15deg) !important;
            filter: grayscale(0.5); box-shadow: none; border-color: #999;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(3deg); }
            40% { transform: translate(1px, -1px) rotate(-3deg); }
            60% { transform: translate(-2px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(3deg); }
            100% { transform: translate(1px, -2px) rotate(-3deg); }
        }

        ul { text-align: left; line-height: 1.6; font-size: 15px; color: #444; padding-left: 20px;}
        li { margin-bottom: 8px; }
        li strong { color: var(--danger-red); }

        /* --- 新增：定位用人形虛線框 --- */
        #human-outline {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            max-width: 300px;
            opacity: 0.7;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s;
        }
        /* 發光特效 */
        .outline-glow {
            filter: drop-shadow(0 0 10px #C8D5B9);
        }
    </style>
</head>
<body>

    <div id="video_container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <svg id="human-outline" class="hidden outline-glow" viewBox="0 0 200 450">
        <circle cx="100" cy="50" r="35" stroke="white" stroke-width="6" stroke-dasharray="10 10" fill="none"/>
        <path d="M 60 100 L 140 100 L 130 250 L 70 250 Z" stroke="white" stroke-width="6" stroke-dasharray="10 10" stroke-linejoin="round" fill="none"/>
        <path d="M 75 250 L 75 420 M 125 250 L 125 420" stroke="white" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round" fill="none"/>
        <path d="M 60 110 L 20 200 M 140 110 L 180 200" stroke="white" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round" fill="none"/>
    </svg>

    <div id="ui-container">
        
        <div id="intro-screen" class="screen">
            <h1>🌿 端午立蛋挑戰 🌿</h1>
            <h2>— 開眼單足立 —</h2>
            <ul>
                <li><strong>定位步驟：</strong> 請退後，將身體對齊畫面上出現的<strong>「人形虛線框」</strong>。</li>
                <li><strong>開始方式：</strong> 定位完成後，將一腳抬起，<strong>腳踝貼在支撐腳膝蓋旁</strong>，自動計時！</li>
                <li><strong>破關條件：</strong> 穩住核心。身體重心偏移太大，蛋就會破掉！</li>
            </ul>
            <button id="start-btn">開啟鏡頭並開始挑戰</button>
        </div>

        <div id="game-screen" class="hidden">
            <div id="game-ui">
                <div id="status-msg">請退後，對齊人形虛線框...</div>
                <div id="timer-display">0.00</div>
                <div id="egg-container">
                    <div id="egg" class="egg"></div>
                </div>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h1>💥 蛋破了！ 💥</h1>
            <h2 id="final-time">堅持時間：0.00 秒</h2>
            <hr style="border-top: 1px dashed #ccc; margin: 15px 0;">
            <h3 style="color: var(--ink-black);">體適能常模評分：</h3>
            <h2 id="rank-title" style="color: var(--danger-red); font-size: 26px;">稱號</h2>
            <p id="rank-desc" style="color: #555; font-size: 15px;"></p>
            <button id="retry-btn">再挑戰一次</button>
        </div>

    </div>

    <script type="module">
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const introScreen = document.getElementById('intro-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const humanOutline = document.getElementById('human-outline');
        
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const timerDisplay = document.getElementById('timer-display');
        const statusMsg = document.getElementById('status-msg');
        const eggElement = document.getElementById('egg');

        let gameState = 'INIT'; 
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        const VISIBILITY_THRESHOLD = 0.5;  
        const SWAY_WARNING = 0.05;
        const SWAY_FAIL = 0.10;

        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        
        pose.setOptions({
            modelComplexity: 0, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if(gameState !== 'GAMEOVER' && gameState !== 'INIT') {
                    await pose.send({image: videoElement});
                }
            },
            facingMode: "user",
            width: 640, 
            height: 480
        });

        startBtn.addEventListener('click', () => {
            introScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameState = 'POSITIONING'; 
            updateStatus("初始化攝影機中...", "var(--glass-bg)", "var(--ink-black)", "var(--bamboo-green)");
            camera.start().catch(err => {
                updateStatus("無法開啟攝影機，請檢查權限設定", "var(--danger-red)", "white", "var(--danger-red)");
            });
        });

        retryBtn.addEventListener('click', () => {
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            resetGame();
        });

        function resetGame() {
            gameState = 'POSITIONING';
            elapsedTime = 0;
            timerDisplay.innerText = "0.00";
            eggElement.className = "egg";
            eggElement.style.transform = `rotate(0deg)`;
            updateStatus("請退後，對齊人形虛線框...", "var(--glass-bg)", "var(--ink-black)", "var(--bamboo-green)");
            clearInterval(timerInterval);
        }

        function updateStatus(text, bg, color, borderColor) {
            statusMsg.innerText = text;
            statusMsg.style.background = bg;
            statusMsg.style.color = color;
            statusMsg.style.borderColor = borderColor;
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.poseLandmarks) {
                // --- 隱藏臉部骨骼：過濾 0~10 號節點，只保留身體 ---
                const bodyLandmarks = results.poseLandmarks.map((lm, index) => {
                    return index > 10 ? lm : { ...lm, visibility: 0 }; // 將臉部透明度設為0不畫出
                });
                const BODY_CONNECTIONS = POSE_CONNECTIONS.filter(conn => conn[0] > 10 && conn[1] > 10);

                // 畫出骨骼連線與節點 (隱藏臉部後)
                drawConnectors(canvasCtx, bodyLandmarks, BODY_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.7)', lineWidth: 4});
                drawLandmarks(canvasCtx, bodyLandmarks, {color: '#4A7C59', lineWidth: 2, radius: 4});

                processGameLogic(results.poseLandmarks);
            }
            canvasCtx.restore();
        }

        function processGameLogic(landmarks) {
            if(gameState === 'GAMEOVER' || gameState === 'INIT') return;

            // 控制人形框顯示與隱藏
            if (gameState === 'POSITIONING') {
                humanOutline.classList.remove('hidden');
            } else {
                humanOutline.classList.add('hidden');
            }

            const nose = landmarks[0];
            const leftHip = landmarks[23];
            const rightHip = landmarks[24];
            const leftKnee = landmarks[25];
            const rightKnee = landmarks[26];
            const leftAnkle = landmarks[27];
            const rightAnkle = landmarks[28];

            if (!nose || !leftHip || !rightHip || !leftKnee || !rightKnee || !leftAnkle || !rightAnkle) return;

            const isFullBodyVisible = (nose.visibility > VISIBILITY_THRESHOLD && 
                                       leftAnkle.visibility > VISIBILITY_THRESHOLD && 
                                       rightAnkle.visibility > VISIBILITY_THRESHOLD);

            if (gameState === 'POSITIONING') {
                if (isFullBodyVisible) {
                    gameState = 'READY';
                    updateStatus("✅ 完美入鏡！請抬起單腳", "var(--bamboo-green)", "white", "var(--bamboo-green)");
                } else {
                    updateStatus("❌ 請對齊虛線框，讓頭與腳都入鏡", "rgba(214, 73, 51, 0.9)", "white", "var(--danger-red)");
                    return; 
                }
            }

            if (gameState === 'READY' || gameState === 'PLAYING') {
                let standAnkle, standKnee, raisedAnkle;
                if (leftAnkle.y > rightAnkle.y) {
                    standAnkle = leftAnkle; standKnee = leftKnee; raisedAnkle = rightAnkle;
                } else {
                    standAnkle = rightAnkle; standKnee = rightKnee; raisedAnkle = leftAnkle;
                }

                const footDistY = Math.abs(raisedAnkle.y - standKnee.y); 
                
                const hipCenterX = (leftHip.x + rightHip.x) / 2;
                const sway = nose.x - hipCenterX; 
                const absSway = Math.abs(sway);

                if (gameState === 'READY') {
                    if (footDistY < 0.1) { 
                        startGame();
                    }
                } 
                else if (gameState === 'PLAYING') {
                    let tiltAngle = sway * 300; 
                    eggElement.style.transform = `rotate(${tiltAngle}deg)`;

                    if (absSway > SWAY_FAIL) {
                        endGame("重心偏移過大！");
                        return;
                    } else if (absSway > SWAY_WARNING) {
                        eggElement.className = "egg egg-warning";
                        updateStatus("⚠️ 穩住，太晃了！", "rgba(214, 73, 51, 0.9)", "white", "var(--danger-red)");
                    } else {
                        eggElement.className = "egg";
                        updateStatus("完美平衡中...", "var(--bamboo-green)", "white", "var(--bamboo-green)");
                    }

                    if (footDistY > 0.2) {
                        endGame("腳落地了！");
                    }
                }
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            startTime = Date.now();
            updateStatus("開始計時，穩住！", "var(--bamboo-green)", "white", "var(--bamboo-green)");
            
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedTime = (Date.now() - startTime) / 1000;
                timerDisplay.innerText = elapsedTime.toFixed(2);
            }, 100); 
        }

        function endGame(reason) {
            gameState = 'GAMEOVER';
            clearInterval(timerInterval);
            humanOutline.classList.add('hidden'); // 確保遊戲結束時隱藏人形
            
            eggElement.className = "egg egg-broken";
            updateStatus(reason, "rgba(51, 51, 51, 0.9)", "white", "#999");

            setTimeout(showResultScreen, 1200);
        }

        function showResultScreen() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            document.getElementById('final-time').innerText = `堅持時間：${elapsedTime.toFixed(2)} 秒`;
            
            const rankTitle = document.getElementById('rank-title');
            const rankDesc = document.getElementById('rank-desc');

            if (elapsedTime < 5) {
                rankTitle.innerText = "屈原的嘆息 (0-5秒)";
                rankDesc.innerText = "哎呀，這蛋殼有點脆！再多練習核心，下次一定行！";
                rankTitle.style.color = "var(--danger-red)";
            } else if (elapsedTime < 15) {
                rankTitle.innerText = "雄黃蛋 (5-15秒)";
                rankDesc.innerText = "及格了！核心還不夠穩，勉強保住蛋殼。";
                rankTitle.style.color = "#D68C33";
            } else if (elapsedTime < 30) {
                rankTitle.innerText = "龍舟舵手 (15-30秒)";
                rankDesc.innerText = "不錯喔！符合成人平均常模，是個健康的立蛋家。";
                rankTitle.style.color = "#3376D6";
            } else {
                rankTitle.innerText = "平衡宗師 (30秒以上)";
                rankDesc.innerText = "太神了！這顆蛋是不是裝了陀螺儀？端午節立蛋王非你莫屬！";
                rankTitle.style.color = "var(--bamboo-green)";
            }
        }
    </script>
</body>
</html>
