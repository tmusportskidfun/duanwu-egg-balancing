<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>沉浸式端午立蛋挑戰</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bamboo-green: #4A7C59;
            --danger-red: #D64933;
            --glass-bg: rgba(250, 249, 246, 0.85);
            --ink-black: #333333;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000;
            color: var(--ink-black);
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        /* --- 相機與背景層 --- */
        #video_container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1; overflow: hidden;
        }
        #input_video { display: none; }
        #output_canvas {
            width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); 
        }

        /* --- 風和日麗的天空背景 (預設透明，合體後漸現) --- */
        #sky-bg {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #74ebd5, #ACB6E5);
            opacity: 0; z-index: 2; /* 蓋在相機之上 */
            pointer-events: none;
            transition: opacity 2s ease-in-out;
        }
        /* 日出的太陽 */
        #sky-bg::before {
            content: ''; position: absolute;
            bottom: 20%; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,253,208,1) 0%, rgba(255,253,208,0) 70%);
            border-radius: 50%; opacity: 0.8;
        }

        /* --- 巨蛋系統 --- */
        #giant-egg-wrapper {
            position: absolute;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; height: 300px;
            z-index: 10; pointer-events: none;
            /* 讓蛋的旋轉軸心在底部，像不倒翁 */
            transform-origin: bottom center; 
            transition: transform 0.1s ease-out, filter 1s ease;
        }

        .egg-part {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #Fdfbf7;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.1), inset 5px 5px 15px rgba(255,255,255,0.8);
            border: 3px solid #EBE6D9;
            box-sizing: border-box;
        }

        /* 下半部：一開始就顯示 */
        #egg-bottom {
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
        }

        /* 上半部：一開始藏在天上 */
        #egg-top {
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            transform: translateY(-80vh);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s;
        }

        /* 合體動畫 Class */
        .egg-merged #egg-top {
            transform: translateY(0);
            opacity: 1;
        }
        .egg-merged {
            /* 合體後發出金光 */
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8));
        }

        /* 破裂的蛋 */
        .egg-broken-state .egg-part {
            background: linear-gradient(135deg, #Fdfbf7 45%, #555 48%, #333 50%, #555 52%, #Fdfbf7 55%);
            filter: grayscale(0.3); border-color: #999; box-shadow: none;
        }
        .egg-broken-state #egg-top {
            transform: translateY(-20px) rotate(-15deg) translateX(-10px);
            transition: transform 0.5s ease-out;
        }

        /* --- UI 浮層 --- */
        #ui-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 20; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }

        .screen {
            background: var(--glass-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center; width: 85%; max-width: 400px;
            pointer-events: auto; border: 2px solid var(--bamboo-green);
        }

        .hidden { display: none !important; }

        h1 { margin: 5px 0 15px 0; color: var(--bamboo-green); font-size: 24px; }
        h2 { margin: 5px 0; font-size: 18px; }
        button {
            background-color: var(--bamboo-green); color: white; border: none; padding: 15px 30px;
            font-size: 18px; border-radius: 12px; cursor: pointer; transition: 0.2s;
            margin-top: 20px; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(74, 124, 89, 0.4);
        }
        button:hover { background-color: #386044; transform: translateY(-2px); }

        #game-ui {
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 500px; text-align: center; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        
        #status-msg {
            font-size: 17px; font-weight: bold; padding: 12px 20px;
            background: var(--glass-bg); backdrop-filter: blur(5px);
            border-radius: 30px; color: var(--ink-black);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; margin-bottom: 15px;
            border: 2px solid var(--bamboo-green); width: 100%; box-sizing: border-box;
        }

        #timer-display {
            font-size: 60px; font-weight: 900; color: white;
            text-shadow: 2px 2px 0px var(--bamboo-green), -2px -2px 0px var(--bamboo-green), 2px -2px 0px var(--bamboo-green), -2px 2px 0px var(--bamboo-green);
        }

        /* 倒數/開始特效 */
        @keyframes startFlash {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; text-shadow: 0 0 30px #FFD700; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        #start-vfx {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 60px; color: #FFF; font-weight: 900;
            text-shadow: 0 0 20px var(--danger-red), 0 0 40px var(--danger-red);
            z-index: 100; pointer-events: none; white-space: nowrap; opacity: 0;
        }
        .vfx-active { animation: startFlash 1.5s ease-out forwards; }

    </style>
</head>
<body>

    <div id="video_container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    
    <div id="sky-bg"></div>

    <div id="giant-egg-wrapper">
        <div id="egg-bottom" class="egg-part"></div>
        <div id="egg-top" class="egg-part"></div>
    </div>
    
    <div id="start-vfx" class="hidden">開始計時！</div>

    <div id="ui-container">
        <div id="intro-screen" class="screen">
            <h1>🌿 沉浸式立蛋挑戰 🌿</h1>
            <ul style="text-align: left; line-height: 1.6; font-size: 15px; padding-left: 20px;">
                <li><strong>階段一：</strong> 退後，讓全身骨架進入畫面。確認後會觸發「天亮」並將你隱藏。</li>
                <li><strong>階段二：</strong> 畫面隱藏後，請憑本體感覺，將單腳抬起貼在<strong>小腿與膝蓋一半處</strong>。</li>
                <li><strong>破關條件：</strong> 穩住重心！畫面的巨蛋會隨你的身體傾斜，太晃蛋就會破！</li>
            </ul>
            <button id="start-btn">開啟鏡頭準備挑戰</button>
        </div>

        <div id="game-screen" class="hidden">
            <div id="game-ui">
                <div id="status-msg">第一階段：請退後，讓全身完整入鏡...</div>
                <div id="timer-display">0.00</div>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h1>💥 蛋破了！ 💥</h1>
            <h2 id="final-time">堅持時間：0.00 秒</h2>
            <hr style="border-top: 1px dashed #ccc; margin: 15px 0;">
            <h3 style="color: var(--ink-black);">體適能常模評分：</h3>
            <h2 id="rank-title" style="color: var(--danger-red); font-size: 26px;">稱號</h2>
            <p id="rank-desc" style="color: #555; font-size: 15px;"></p>
            <button id="retry-btn">再挑戰一次</button>
        </div>
    </div>

    <script type="module">
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const introScreen = document.getElementById('intro-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const skyBg = document.getElementById('sky-bg');
        const giantEggWrapper = document.getElementById('giant-egg-wrapper');
        const startVfx = document.getElementById('start-vfx');
        
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const timerDisplay = document.getElementById('timer-display');
        const statusMsg = document.getElementById('status-msg');

        let gameState = 'INIT'; 
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        const VISIBILITY_THRESHOLD = 0.6;  
        const SWAY_FAIL = 0.12;
        const TARGET_TOLERANCE = 0.12; 

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({
            modelComplexity: 0, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if(gameState !== 'GAMEOVER' && gameState !== 'INIT') {
                    await pose.send({image: videoElement});
                }
            },
            facingMode: "user", width: 640, height: 480
        });

        startBtn.addEventListener('click', () => {
            introScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            resetGame();
            camera.start().catch(err => {
                updateStatus("無法開啟攝影機，請檢查權限設定", "var(--danger-red)", "white", "var(--danger-red)");
            });
        });

        retryBtn.addEventListener('click', () => {
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            resetGame();
        });

        function resetGame() {
            gameState = 'POSITIONING_BODY';
            elapsedTime = 0;
            timerDisplay.innerText = "0.00";
            
            // 復原環境
            skyBg.style.opacity = '0';
            giantEggWrapper.className = ''; // 移除合併或破裂狀態
            giantEggWrapper.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            
            updateStatus("第一階段：請退後，讓頭與腳完整入鏡", "var(--glass-bg)", "var(--ink-black)", "var(--bamboo-green)");
            clearInterval(timerInterval);
        }

        function updateStatus(text, bg, color, borderColor) {
            statusMsg.innerText = text;
            statusMsg.style.background = bg;
            statusMsg.style.color = color;
            statusMsg.style.borderColor = borderColor;
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // 只有在第一階段 (尚未天亮時) 才把相機畫面和骨架畫出來
            if (gameState === 'POSITIONING_BODY') {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                
                if (results.poseLandmarks) {
                    const bodyLandmarks = results.poseLandmarks.map((lm, index) => index > 10 ? lm : { ...lm, visibility: 0 });
                    const BODY_CONNECTIONS = POSE_CONNECTIONS.filter(conn => conn[0] > 10 && conn[1] > 10);
                    drawConnectors(canvasCtx, bodyLandmarks, BODY_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.7)', lineWidth: 4});
                    drawLandmarks(canvasCtx, bodyLandmarks, {color: '#4A7C59', lineWidth: 2, radius: 4});
                }
            } 
            // 天亮之後，Canvas 就不畫任何東西了 (純透明)，完全靠 CSS 背景和巨蛋顯示
            
            if (results.poseLandmarks) {
                processGameLogic(results.poseLandmarks);
            }
            canvasCtx.restore();
        }

        function processGameLogic(landmarks) {
            if(gameState === 'GAMEOVER' || gameState === 'INIT') return;

            const nose = landmarks[0];
            const leftHip = landmarks[23];
            const rightHip = landmarks[24];
            const leftKnee = landmarks[25];
            const rightKnee = landmarks[26];
            const leftAnkle = landmarks[27];
            const rightAnkle = landmarks[28];

            if (!nose || !leftHip || !rightHip || !leftKnee || !rightKnee || !leftAnkle || !rightAnkle) return;

            const isFullBodyVisible = (nose.visibility > VISIBILITY_THRESHOLD && 
                                       leftAnkle.visibility > VISIBILITY_THRESHOLD && 
                                       rightAnkle.visibility > VISIBILITY_THRESHOLD);

            // --- 狀態一：全身定位 ---
            if (gameState === 'POSITIONING_BODY') {
                if (isFullBodyVisible) {
                    gameState = 'TRANSITIONING'; // 防止重複觸發
                    updateStatus("✅ 完美入鏡！準備天亮...", "var(--bamboo-green)", "white", "var(--bamboo-green)");
                    
                    // 觸發合體動畫與天亮
                    giantEggWrapper.classList.add('egg-merged');
                    skyBg.style.opacity = '1';

                    // 給動畫 1.5 秒跑完，再進入第二階段
                    setTimeout(() => {
                        gameState = 'POSITIONING_LEG';
                        updateStatus("第二階段：請憑感覺，將單腳抬起貼在小腿與膝蓋中點", "rgba(50,50,50,0.8)", "white", "var(--bamboo-green)");
                    }, 1500);
                }
                return;
            }

            // --- 狀態二 & 三：盲測定位腳部 與 遊戲進行中 ---
            if (gameState === 'POSITIONING_LEG' || gameState === 'PLAYING') {
                
                // 判斷哪一隻腳是支撐腳
                let standAnkle, standKnee, raisedAnkle;
                if (leftAnkle.y > rightAnkle.y) {
                    standAnkle = leftAnkle; standKnee = leftKnee; raisedAnkle = rightAnkle;
                } else {
                    standAnkle = rightAnkle; standKnee = rightKnee; raisedAnkle = leftAnkle;
                }

                // 計算目標點 (膝蓋與腳踝中點)
                const targetMidX = (standKnee.x + standAnkle.x) / 2;
                const targetMidY = (standKnee.y + standAnkle.y) / 2;

                const dx = raisedAnkle.x - targetMidX;
                const dy = raisedAnkle.y - targetMidY;
                const distanceToTarget = Math.sqrt(dx * dx + dy * dy);

                // 身體偏移量 (鼻子相對於臀部中心)
                const hipCenterX = (leftHip.x + rightHip.x) / 2;
                const sway = nose.x - hipCenterX; 
                const absSway = Math.abs(sway);

                if (gameState === 'POSITIONING_LEG') {
                    // 若腳貼近中點
                    if (distanceToTarget < TARGET_TOLERANCE) { 
                        startGame();
                    }
                } 
                else if (gameState === 'PLAYING') {
                    // 巨蛋連動傾斜特效 (放大傾斜角度讓視覺更明顯)
                    let tiltAngle = sway * 400; 
                    // 限制最大傾斜角度避免翻轉過頭
                    if(tiltAngle > 45) tiltAngle = 45;
                    if(tiltAngle < -45) tiltAngle = -45;
                    
                    // 因為外層用了 translate(-50%, -50%) 置中，所以要在這裡合併 transform
                    giantEggWrapper.style.transform = `translate(-50%, -50%) rotate(${tiltAngle}deg)`;

                    // 失敗判定：晃動過大
                    if (absSway > SWAY_FAIL) {
                        endGame("重心偏移過大，蛋破了！");
                        return;
                    } 
                    // 失敗判定：腳掉落 (容錯稍微放大)
                    else if (distanceToTarget > TARGET_TOLERANCE + 0.1) {
                        endGame("腳滑落了！");
                        return;
                    }

                    // 視覺回饋提示
                    if (absSway > SWAY_FAIL * 0.6) {
                        updateStatus("⚠️ 太晃了，穩住！", "rgba(214, 73, 51, 0.9)", "white", "var(--danger-red)");
                    } else {
                        updateStatus("✨ 完美平衡中...", "rgba(74, 124, 89, 0.9)", "white", "var(--bamboo-green)");
                    }
                }
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            startTime = Date.now();
            updateStatus("專注核心！", "rgba(74, 124, 89, 0.9)", "white", "var(--bamboo-green)");
            
            // 觸發開場特效
            startVfx.classList.remove('hidden');
            startVfx.classList.add('vfx-active');
            setTimeout(() => {
                startVfx.classList.remove('vfx-active');
                startVfx.classList.add('hidden');
            }, 1500);

            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedTime = (Date.now() - startTime) / 1000;
                timerDisplay.innerText = elapsedTime.toFixed(2);
            }, 100); 
        }

        function endGame(reason) {
            gameState = 'GAMEOVER';
            clearInterval(timerInterval);
            
            // 蛋破裂特效
            giantEggWrapper.classList.add('egg-broken-state');
            updateStatus(reason, "rgba(51, 51, 51, 0.9)", "white", "#999");

            setTimeout(showResultScreen, 1500);
        }

        function showResultScreen() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            document.getElementById('final-time').innerText = `堅持時間：${elapsedTime.toFixed(2)} 秒`;
            
            const rankTitle = document.getElementById('rank-title');
            const rankDesc = document.getElementById('rank-desc');

            if (elapsedTime < 5) {
                rankTitle.innerText = "屈原的嘆息 (0-5秒)";
                rankDesc.innerText = "哎呀，這蛋殼有點脆！再多練習核心，下次一定行！";
                rankTitle.style.color = "var(--danger-red)";
            } else if (elapsedTime < 15) {
                rankTitle.innerText = "雄黃蛋 (5-15秒)";
                rankDesc.innerText = "及格了！在看不到自己的情況下能站穩，很不容易！";
                rankTitle.style.color = "#D68C33";
            } else if (elapsedTime < 30) {
                rankTitle.innerText = "龍舟舵手 (15-30秒)";
                rankDesc.innerText = "不錯喔！本體感覺非常敏銳，是個標準的立蛋家。";
                rankTitle.style.color = "#3376D6";
            } else {
                rankTitle.innerText = "盲測宗師 (30秒以上)";
                rankDesc.innerText = "太神了！失去視覺還能人蛋合一，端午節立蛋王非你莫屬！";
                rankTitle.style.color = "var(--bamboo-green)";
            }
        }
    </script>
</body>
</html>
